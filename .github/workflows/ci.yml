name: SocialLite CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sociallite
          POSTGRES_USER: sociallite
          POSTGRES_PASSWORD: sociallite_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sociallite -d sociallite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sociallite
      DB_USER: sociallite
      DB_PASSWORD: sociallite_dev_password
      JWT_SECRET: ci_test_secret_key_only
      JWT_ALGORITHM: HS256

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx uvicorn

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build