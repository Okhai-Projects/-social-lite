services:
  db:
    image: postgres:16
    container_name: social-lite-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sociallite
      POSTGRES_USER: sociallite
      POSTGRES_PASSWORD: sociallite_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: